# Build layers (escalate only when something is wrong):
#
#   1) Day-to-day INCREMENTAL (default):
#        cargo run
#      Prepares Bevy once into target/debug; later runs only rebuild this crate.
#      `cargo run --release` is a SEPARATE cache (target/release) — not a
#      substitute for preparing `cargo run`.
#
#   2) Static portable .exe:
#        cargo run-static
#
#   3) Crate-only wipe (Bevy untouched):
#        scripts\rebuild_crate.bat
#
#   4) DEEP wipe (Bevy + all deps) — last resort, multi-minute:
#        scripts\rebuild_deep.bat
#
# Optional: scripts\cargo_hot.bat <cargo args...>  → HIGH priority, -j CPUs

[build]
jobs = 8

[alias]
run-static = "run --release --no-default-features"
build-static = "build --release --no-default-features"
clean-crate = "clean -p aicomp-soccer-sim"

# Faster links than MSVC link.exe (stable rust-lld).
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
