[package]
name = "aicomp-soccer-sim"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fully 2D top-down close copy of AIComp Soccer for rapid offline testing"
default-run = "soccer_sim"

# Bins (easy entry points):
#   soccer_sim          — Bevy viewer (window)
#   soccer_headless     — batch / fishtest-style matches (JSON stdout, no window)
#   debug_tackle_test   — scripted Test1/Test2 steal assert
#   timeplot_until_goal — AIA graph TimePlot capture

[[bin]]
name = "soccer_sim"
path = "src/main.rs"

[[bin]]
name = "soccer_headless"
path = "src/bin/soccer_headless.rs"

[[bin]]
name = "timeplot_until_goal"
path = "src/bin/timeplot_until_goal.rs"

[[bin]]
name = "debug_tackle_test"
path = "src/bin/debug_tackle_test.rs"

[[bin]]
name = "titanium_drill"
path = "src/bin/titanium_drill.rs"

[features]
# Fast local edit→run is the DEFAULT (Bevy dynamic linking).
#
# Tier 1 — normal (default): only this crate rebuilds on src edits; prepared
#          Bevy libraries / DLLs in target/ are left alone.
# Tier 2 — static: portable .exe (`cargo run-static`). Keeps dep cache.
# Tier 3 — crate-only: something looks wrong → `scripts\rebuild_crate.bat`
#          (`cargo clean -p aicomp-soccer-sim`). Bevy untouched.
# Tier 4 — DEEP: still wrong → `scripts\rebuild_deep.bat` (full `cargo clean`,
#          recompiles Bevy). Never casual.
default = ["fast_link"]
fast_link = ["bevy/dynamic_linking"]

[dependencies]
# Top-down 2D only.
bevy = { version = "0.19" }
micropool = "0.3"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
approx = "0.5"

# Fast edit→run: light opt on our crate. Deps stay optimized once cached;
# avoid `cargo clean` unless you truly need a from-scratch rebuild.
[profile.dev]
opt-level = 1
incremental = true

[profile.dev.package."*"]
opt-level = 3

# Explicit slow/max-opt path when sharing a single static .exe (no Bevy DLLs).
[profile.release-static]
inherits = "release"
lto = "thin"
codegen-units = 1
