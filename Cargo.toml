[package]
name = "aicomp-soccer-sim"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fully 2D top-down close copy of AIComp Soccer for rapid offline testing"
default-run = "soccer_sim"

# Bins (easy entry points):
#   soccer_sim          — Bevy viewer (window)
#   soccer_headless     — batch / fishtest-style matches (JSON stdout, no window)
#   debug_tackle_test   — scripted Test1/Test2 steal assert
#   timeplot_until_goal — AIA graph TimePlot capture

[[bin]]
name = "soccer_sim"
path = "src/main.rs"

[[bin]]
name = "soccer_headless"
path = "src/bin/soccer_headless.rs"

[[bin]]
name = "timeplot_until_goal"
path = "src/bin/timeplot_until_goal.rs"

[[bin]]
name = "debug_tackle_test"
path = "src/bin/debug_tackle_test.rs"

[[bin]]
name = "titanium_drill"
path = "src/bin/titanium_drill.rs"

[features]
# Fast local edit→run is the DEFAULT (Bevy dynamic linking).
#
# Tier 1 — normal (default): only this crate rebuilds on src edits; prepared
#          Bevy libraries / DLLs in target/ are left alone.
# Tier 2 — static: portable .exe (`cargo run-static`). Keeps dep cache.
# Tier 3 — crate-only: scripts\rebuild_crate.bat
# Tier 4 — DEEP: scripts\rebuild_deep.bat (full wipe; multi-minute Bevy/wgpu).
#
# nn_train is OFF by default on purpose: square_weights harness is intact but
# gated so slow Bevy cold builds are not mistaken for "training broken".
# Re-enable: cargo build --features nn_train
default = ["fast_link"]
fast_link = ["bevy/dynamic_linking"]
nn_train = []

[dependencies]
# Viewer is 2D + UI only — drop default 3D/audio (Bevy docs: compile less code).
bevy = { version = "0.19", default-features = false, features = ["2d", "ui", "png"] }
micropool = "0.3"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
approx = "0.5"

# --- Profiles (Bevy / community cold-build guidance) ---
# opt-level=3 on ALL deps makes first Bevy builds 5–10× slower (reports like
# ~2 min → ~13+ min). Default stays cold-friendlier; use profile `dev-smooth`
# after Bevy is cached if the viewer feels sluggish:
#   cargo run --profile dev-smooth
[profile.dev]
opt-level = 1
incremental = true

[profile.dev-smooth]
inherits = "dev"

[profile.dev-smooth.package."*"]
opt-level = 3

# Explicit slow/max-opt path when sharing a single static .exe (no Bevy DLLs).
[profile.release-static]
inherits = "release"
lto = "thin"
codegen-units = 1
