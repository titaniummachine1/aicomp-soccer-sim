[package]
name = "aicomp-soccer-sim"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fully 2D top-down close copy of AIComp Soccer for rapid offline testing"
default-run = "soccer_sim"

# Bins:
#   soccer_sim          — Bevy viewer (default)
#   soccer_headless     — batch matches (JSON stdout, no window)
#   debug_tackle_test   — scripted steal assert
#   timeplot_until_goal — AIA graph TimePlot capture

[[bin]]
name = "soccer_sim"
path = "src/main.rs"

[[bin]]
name = "soccer_headless"
path = "src/bin/soccer_headless.rs"

[[bin]]
name = "timeplot_until_goal"
path = "src/bin/timeplot_until_goal.rs"

[[bin]]
name = "debug_tackle_test"
path = "src/bin/debug_tackle_test.rs"

[[bin]]
name = "titanium_drill"
path = "src/bin/titanium_drill.rs"

[[bin]]
name = "titanium_drill2"
path = "src/bin/titanium_drill2.rs"

[[bin]]
name = "titanium_drill3"
path = "src/bin/titanium_drill3.rs"

[[bin]]
name = "titanium_matchtrace"
path = "src/bin/titanium_matchtrace.rs"

[[bin]]
name = "flypast_count"
path = "src/bin/flypast_count.rs"

[features]
# Day-to-day: `cargo run` (dev + fast_link). Bevy builds ONCE into target/debug,
# then only THIS crate relinks. Do NOT flip features/profiles casually.
#
# Tier 1 — normal: cargo run / cargo run --release (separate caches!)
# Tier 2 — static: cargo run-static
# Tier 3 — crate-only: scripts\rebuild_crate.bat
# Tier 4 — DEEP: scripts\rebuild_deep.bat
#
# nn_train OFF by default (intact behind --features nn_train).
default = ["fast_link"]
fast_link = ["bevy/dynamic_linking"]
nn_train = []

[dependencies]
# Viewer is 2D + UI only — drop default 3D/audio.
bevy = { version = "0.19", default-features = false, features = ["2d", "ui", "png"] }
arboard = "3"
micropool = "0.3"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
approx = "0.5"

# Bevy official incremental setup: light opt on our crate, heavy opt on deps.
# Needed for fast edit→run AND Windows dynamic_linking symbol limits.
# First `cargo run` after a feature/profile change prepares Bevy once; after
# that Bevy stays put. `cargo run --release` uses a DIFFERENT cache (target/release).
[profile.dev]
opt-level = 1
incremental = true

[profile.dev.package."*"]
opt-level = 3

# Explicit slow/max-opt path when sharing a single static .exe (no Bevy DLLs).
[profile.release-static]
inherits = "release"
lto = "thin"
codegen-units = 1

[[bin]]
name = "parity_check"
path = "src/bin/parity_check.rs"
