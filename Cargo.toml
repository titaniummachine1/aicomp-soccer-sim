[package]
name = "aicomp-soccer-sim"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fully 2D top-down close copy of AIComp Soccer for rapid offline testing"

[[bin]]
name = "soccer_sim"
path = "src/main.rs"

[[bin]]
name = "timeplot_until_goal"
path = "src/bin/timeplot_until_goal.rs"

[features]
# Shareable/portable builds are the default (fully static).
# For faster local edit→run only:
#   cargo run --features fast_link
default = []
fast_link = ["bevy/dynamic_linking"]

[dependencies]
# Top-down 2D only.
bevy = { version = "0.19" }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
approx = "0.5"

# Fast edit→run: light opt on our code, full opt on deps.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
